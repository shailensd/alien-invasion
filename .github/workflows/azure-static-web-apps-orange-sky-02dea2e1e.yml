name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygbag pygame
      
      - name: Build with Pygbag
        run: pygbag --build .
      
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ba3e0bc8534160fa9a5fd400a3f76abf3d282234fbf874e3b64af6c5993a29f502-cfd29ece-607c-4ca3-b8f3-a63b0a983fb701e082402dea2e1e }}
          repo_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_SKY_02DEA2E1E }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "build/web"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ba3e0bc8534160fa9a5fd400a3f76abf3d282234fbf874e3b64af6c5993a29f502-cfd29ece-607c-4ca3-b8f3-a63b0a983fb701e082402dea2e1e }}
          action: "close"
